name: Quality and dependency security

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test multilingual keyword emphasis
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: safeway_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safeway_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AI_TEST_POSTGRES_URL: postgresql://postgres:synthetic-test-password@localhost:5432/safeway_ai_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement backend/requirements.txt

      - name: Compile backend source
        run: python -m compileall -q backend

      - name: Install test dependencies
        run: python -m pip install --requirement backend/requirements-test.txt

      - name: Enable pgvector in disposable test database
        run: python -c "import os, psycopg2; c = psycopg2.connect(os.environ['AI_TEST_POSTGRES_URL']); c.autocommit = True; c.cursor().execute('CREATE EXTENSION IF NOT EXISTS vector'); c.close()"

      - name: Test route authentication and ownership
        run: python -m unittest discover -s backend/tests -v

      - name: Validate multilingual AI evaluation fixtures
        run: python -m backend.ai.evaluate

      - name: Install dependency auditor
        run: python -m pip install pip-audit

      - name: Audit backend dependencies
        run: python -m pip_audit --requirement backend/requirements.txt
